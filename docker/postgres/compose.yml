services:
  postgres:
    image: postgres:16
    container_name: sircuitlab-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../../data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
